<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Nano Banana Kiosk</title>
    <link
      rel="stylesheet"
      href="./styles.css"
    />
    <style media="print">
      /* Print styles */
      @page {
        size: 6in 4in landscape;
        margin: 0.2in;
      }
      body {
        background: #fff;
        color: #000;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        width: 100%;
        max-width: 6in;
        padding: 0;
      }
      .card {
        border: none;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }
      .bar,
      .grid,
      .row,
      .status,
      .hint,
      button,
      #qr,
      #btnCopy,
      #btnOpen {
        display: none !important;
      }
      .stage {
        width: 100%;
        height: 4in;
        max-height: calc(4in - 0.4in);
        aspect-ratio: auto;
        background: #fff;
        border-radius: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 0;
        background: #fff;
      }
      video,
      canvas {
        display: none !important;
      }
      h2 {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Left: Camera -->
      <section class="card">
        <div class="bar">
          <h2>📷 Camera</h2>
          <div class="row">
            <button
              id="btnStart"
              class="primary"
            >
              Start camera
            </button>
            <button
              id="btnSnap"
              disabled
            >
              Take picture
            </button>
            <button
              id="btnRetake"
              class="ghost hidden"
            >
              Retake
            </button>
          </div>
        </div>

        <div class="stage">
          <video
            id="video"
            playsinline
            autoplay
            muted
            class="hidden"
          ></video>
          <canvas
            id="canvas"
            class="hidden"
          ></canvas>
          <img
            id="photo"
            alt="snapshot"
            class="hidden"
          />
          <div
            id="countdown"
            class="hidden"
          ></div>
        </div>

        <p
          class="status"
          id="camStatus"
        >
          Camera is idle.
        </p>
      </section>

      <!-- Right: Presets -->
      <section class="card">
        <h2>🎛️ Presets</h2>

        <div
          class="grid"
          id="presetGrid"
        >
          <!-- 3D Figurine (single-person safe) -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image. Create a 1/7-scale commercial figurine of the person in the photo, realistic style, in a real environment. Place the figurine on a computer desk with a round transparent acrylic base. Put Light Green text on the base with the person’s name only if text is already present in the original image; otherwise avoid adding any text. Show a computer screen displaying the figurine’s 3D modeling process and a nearby toy packaging box that uses two-dimensional flat illustrations based on the same person. Keep facial likeness accurate. Do not add extra people. Avoid watermarks or captions."
          >
            👑 Make me a 3D Figurine
          </button>

          <!-- 1980s Yearbook (single-person, identity preserved) -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image. Generate a 1980s yearbook portrait of this person. Preserve the exact face and identity. You may change background, hairstyle, facial hair, glasses, outfit, and lighting to fit 1980s ‘glamour shots’ aesthetics (big hair, mullets, large glasses, soft/foggy lighting, fun backdrops). No added text or watermarks. Single subject only."
          >
            1980’s Yearbook
          </button>

          <!-- Polaroid -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image. Generate a 4K ultra-realistic instant-camera (Polaroid-style) photo of this person. Preserve facial features exactly. Add gentle motion blur and flash-like lighting. Use a soft white curtain backdrop. Natural, candid snapshot vibe. No added text. Single subject only."
          >
            Polaroid
          </button>

          <!-- Hair Style Change -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image. Show what this person would look like with medium-length chestnut brown hair. Change only hair color, length, texture, and style as specified. Keep the same face, skin tone, and lighting. Do not modify age or body. No added text."
          >
            Hair Style Change
          </button>

          <!-- Hugging Younger Self -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image. Create a Polaroid-style photo where this person appears twice: an ‘older self’ and a ‘younger self’ hugging, both facing the camera. Preserve the same identity for both subjects. Adjust hair/outfit subtly to imply age difference while keeping natural skin tones. White curtain background, slight blur, flash-like lighting. No added text."
          >
            Hugging Younger Self
          </button>

          <!-- Photo to Painting (concrete values, no placeholders) -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image.
Reimagine this portrait as an Impressionist oil painting set in the 1880s.
Present the final as a photographed framed artwork in a matte gold frame.
Maintain accurate facial likeness and identity. No added text or signatures."
          >
            Photo to Painting
          </button>

          <!-- LinkedIn Headshot -->
          <button
            class="chip"
            data-prompt="Use the uploaded webcam photo as the only reference image. Transform this portrait into a high-quality professional LinkedIn headshot. Preserve the exact face and identity. Highlight natural features (eyes, hair, skin tone) with true-to-life colors and smooth, even lighting. Use a clean, neutral cityscape background with soft depth of field to keep focus on the subject. Frame tightly on head and upper shoulders. The image should be sharp, well-lit, and convey confidence and professionalism while retaining all natural features and appearance. Single subject only. No added text or watermarks."
          >
            💼 LinkedIn Headshot
          </button>
        </div>

        <div class="row mt">
          <button
            id="btnApply"
            class="primary"
            disabled
          >
            <span id="applyText">Apply preset</span>
            <span
              id="applySpinner"
              class="spinner hidden"
              aria-hidden="true"
            ></span>
          </button>
          <button
            id="btnDownload"
            disabled
          >
            Download result
          </button>
          <button
            id="btnPrint"
            disabled
          >
            🖨️ Print
          </button>
        </div>

        <p
          class="status"
          id="apiStatus"
        >
          Take a picture, pick a preset, then apply.
        </p>

        <div class="row mt">
          <img
            id="qr"
            class="hidden"
            alt="QR code to your photo"
          />
        </div>

        <div class="row mt">
          <button
            id="btnCopy"
            class="ghost hidden"
          >
            Copy link
          </button>
          <a
            id="btnOpen"
            class="ghost hidden"
            target="_blank"
            rel="noopener"
          >
            Open link
          </a>
        </div>

        <div class="hint">
          Tip: Works with touch
          <em>and</em>
          mouse clicks. On desktop, press
          <kbd>Space</kbd>
          to snap.
        </div>
      </section>
    </div>

    <script
      src="./app.js"
      type="module"
    ></script>
  </body>
</html>
