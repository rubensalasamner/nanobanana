<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Photo</title>
    <meta property="og:title" content="Your Photo" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #e7ebef;
        --card: #121821;
        --accent: #69d1ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Ubuntu;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      main {
        width: min(960px, 100%);
        background: var(--card);
        border-radius: 20px;
        border: 1px solid #1f2835;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      h1,
      p {
        margin: 0;
      }
      img {
        width: 100%;
        border-radius: 16px;
        background: #000;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      button,
      a.button {
        appearance: none;
        border: 1px solid #2a3648;
        background: #131a25;
        color: inherit;
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 16px;
        text-decoration: none;
        cursor: pointer;
      }
      button.primary,
      a.button.primary {
        background: linear-gradient(180deg, #1a9fff, #0b7bd1);
        border-color: #0b7bd1;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .share-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .share-links a {
        font-size: 14px;
        padding: 8px 12px;
      }
      .hidden {
        display: none !important;
      }
      footer {
        font-size: 13px;
        color: #94a3b8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🎉 Your Photo</h1>
        <p>Share or download your edited image below.</p>
      </header>

      <img id="photo" alt="Edited result" />

      <div class="row">
        <button id="downloadBtn" class="primary">⬇️ Download</button>
        <button id="copyLink">📋 Copy link</button>
        <button id="shareBtn" class="hidden">📤 Share…</button>
      </div>

      <div class="row share-links">
        <a id="whatsapp" class="button" target="_blank" rel="noopener">WhatsApp</a>
        <a id="facebook" class="button" target="_blank" rel="noopener">Facebook</a>
        <a id="twitter" class="button" target="_blank" rel="noopener">X / Twitter</a>
        <a id="sms" class="button" target="_blank" rel="noopener">SMS</a>
      </div>

      <footer>
        Having trouble opening the link? Copy it and send it to yourself, or ask a staff member for
        help.
      </footer>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const imageUrl = params.get('imageUrl');
      const id = params.get('id') || 'photo';
      const mime = params.get('mime') || 'image/webp';

      const photoEl = document.getElementById('photo');
      const downloadBtn = document.getElementById('downloadBtn');
      const copyLinkBtn = document.getElementById('copyLink');
      const shareBtn = document.getElementById('shareBtn');
      const whatsapp = document.getElementById('whatsapp');
      const facebook = document.getElementById('facebook');
      const twitter = document.getElementById('twitter');
      const sms = document.getElementById('sms');

      if (!imageUrl) {
        photoEl.alt = 'Missing image';
        photoEl.style.display = 'none';
        document.querySelector('main').insertAdjacentHTML(
          'beforeend',
          '<p style="color:#f87171">Image URL was not provided. Please return to the kiosk and try again.</p>'
        );
      } else {
        photoEl.src = imageUrl;
        const ext = mime === 'image/png' ? 'png' : mime === 'image/jpeg' ? 'jpg' : 'webp';
        const filename = `booth-${id}.${ext}`;

        const encodedUrl = encodeURIComponent(imageUrl);
        whatsapp.href = `https://wa.me/?text=${encodedUrl}`;
        facebook.href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
        twitter.href = `https://x.com/intent/tweet?url=${encodedUrl}`;
        sms.href = `sms:?&body=${encodedUrl}`;

        copyLinkBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(imageUrl);
            copyLinkBtn.textContent = '✅ Copied!';
            setTimeout(() => (copyLinkBtn.textContent = '📋 Copy link'), 2000);
          } catch {
            copyLinkBtn.textContent = '❌ Copy failed';
            setTimeout(() => (copyLinkBtn.textContent = '📋 Copy link'), 2000);
          }
        });

        downloadBtn.addEventListener('click', async () => {
          downloadBtn.disabled = true;
          const originalText = downloadBtn.textContent;
          downloadBtn.textContent = '⬇️ Downloading…';
          try {
            const resp = await fetch(imageUrl, { mode: 'cors' });
            if (!resp.ok) throw new Error('Fetch failed');
            const blob = await resp.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            downloadBtn.textContent = '✅ Saved';
          } catch (err) {
            console.error('Download failed', err);
            downloadBtn.textContent = '❌ Failed, tap again';
          } finally {
            downloadBtn.disabled = false;
            setTimeout(() => (downloadBtn.textContent = originalText), 2000);
          }
        });

        if (navigator.share) {
          shareBtn.classList.remove('hidden');
          shareBtn.addEventListener('click', async () => {
            try {
              await navigator.share({
                title: 'My edited photo',
                text: 'Check out my photo from the Nano Banana booth!',
                url: imageUrl,
              });
            } catch {
              // no-op
            }
          });
        }
      }
    </script>
  </body>
</html>
